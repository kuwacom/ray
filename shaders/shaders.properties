#
# Ray shaders.properties
# Options and profiles. See docs/architecture.md
# Keep this file ASCII only: Iris reads .properties as ISO-8859-1 and non-ASCII bytes break its preprocessor
# All options live in lib/settings.glsl. Plain defaults = HIGH profile
#

#------------------------------------------------------------------------------
# Iris feature flags (no OptiFine support. SSBO / custom images / compute are required)
#------------------------------------------------------------------------------
iris.features.required = SSBO CUSTOM_IMAGES COMPUTE_SHADERS
iris.features.optional = BLOCK_EMISSION_ATTRIBUTE REVERSED_CULLING ENTITY_TRANSLUCENT

#------------------------------------------------------------------------------
# Basic rendering settings
#------------------------------------------------------------------------------
# Treat both hands as independent light sources (enables heldBlockLightValue2)
oldHandLight = false
dynamicHandLight = false
oldLighting = false
# Move vanilla AO into vertex color alpha (the G-buffer stores AO separately)
separateAo = true
underwaterOverlay = false
vignette = false
sun = true
moon = true
#if CLOUDS == 1
clouds = fancy
#else
clouds = off
#endif
particles.ordering = mixed
beacon.beam.depth = true
rain.depth = false
frustum.culling = true
allowConcurrentCompute = false
supportsColorCorrection = false

#------------------------------------------------------------------------------
# Shadow pass (sun shadows + voxelization)
#------------------------------------------------------------------------------
# Always run the shadow pass, even without sun shadows, because it voxelizes the world
shadow.enabled = true
# No culling within voxelDistance (lib/settings.glsl) so the voxel volume is complete
shadow.culling = reversed
voxelizeLightBlocks = true
shadowTerrain = true
shadowTranslucent = true
shadowPlayer = true
shadowLightBlockEntities = true
# shadow_entities / shadow_block also voxelize occluders and register off-screen entity lights
#if defined ENTITY_SHADOWS || defined LIGHT_ENTITY_OCCLUSION || defined LIGHT_PLAYER_OCCLUSION || defined ENTITY_LIGHTS
shadowEntities = true
#else
shadowEntities = false
#endif
#if defined BLOCK_ENTITY_SHADOWS || defined LIGHT_ENTITY_OCCLUSION || defined ENTITY_LIGHTS
shadowBlockEntities = true
#else
shadowBlockEntities = false
#endif

#------------------------------------------------------------------------------
# Custom textures
#------------------------------------------------------------------------------
customTexture.blueNoiseTex = textures/blue_noise.png
# Cloud noise (tools/gen_cloud_noise.py). Raw data, bilinear + repeat via .mcmeta
customTexture.cloudShapeTex = textures/cloud_shape.dat TEXTURE_3D RG8 128 128 128 RG UNSIGNED_BYTE
customTexture.cloudDetailTex = textures/cloud_detail.dat TEXTURE_3D RGBA8 64 64 64 RGBA UNSIGNED_BYTE
customTexture.cloudNoiseTex = textures/cloud_noise2d.dat TEXTURE_2D RGBA8 512 512 RGBA UNSIGNED_BYTE
# Lens (tools/gen_lens_textures.py): diffraction starburst (polar, 8 blade counts) and lens dirt
customTexture.lensStarburstTex = textures/lens_starburst.dat TEXTURE_2D RGBA8 1024 256 RGBA UNSIGNED_BYTE
customTexture.lensDirtTex = textures/lens_dirt.png
# Water waves (tools/gen_water_waves.py): FFT ocean tile, 64 looping frames (slope x, slope z, height, displacement divergence)
customTexture.waterWaveTex = textures/water_waves.dat TEXTURE_3D RGBA8 128 128 64 RGBA UNSIGNED_BYTE

#------------------------------------------------------------------------------
# SSBOs (layout: lib/buffers/ssbo.glsl)
#------------------------------------------------------------------------------
# 0: FrameData (exposure, sun/moon irradiance, sky SH, histogram)
bufferObject.0 = 4096
# 1: BlockData (light / shape / tint tables, built by setup.csh)
bufferObject.1 = 24576
# 2: GlobalLights (up to 4096 light instances for this frame)
bufferObject.2 = 131088
# 3: LightBins (world-space light bins, sized for the largest voxel volume)
bufferObject.3 = 9584640
# 4: EntityTriangles (entity triangles for shaped light shadows, LIGHT_OCCLUSION_MODE=1)
bufferObject.4 = 838672

#------------------------------------------------------------------------------
# Custom images (all 16 slots used). GLSL declarations: lib/buffers/images.glsl
# Each program declares only the images it writes (IMG_* defines): NVIDIA allows 8 image uniforms per stage
#------------------------------------------------------------------------------
#if VOXEL_VOLUME == 0
image.voxelBlockImg = voxelBlockSampler RED_INTEGER R16UI UNSIGNED_SHORT true false 128 64 128
image.voxelEntityImg = voxelEntitySampler RED_INTEGER R32UI UNSIGNED_INT true false 128 64 128
image.voxelEmitImg = voxelEmitSampler RED_INTEGER R32UI UNSIGNED_INT true false 128 64 128
image.floodImgA = floodSamplerA RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 128 64 128
image.floodImgB = floodSamplerB RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 128 64 128
#elif VOXEL_VOLUME == 1
image.voxelBlockImg = voxelBlockSampler RED_INTEGER R16UI UNSIGNED_SHORT true false 192 96 192
image.voxelEntityImg = voxelEntitySampler RED_INTEGER R32UI UNSIGNED_INT true false 192 96 192
image.voxelEmitImg = voxelEmitSampler RED_INTEGER R32UI UNSIGNED_INT true false 192 96 192
image.floodImgA = floodSamplerA RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 192 96 192
image.floodImgB = floodSamplerB RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 192 96 192
#elif VOXEL_VOLUME == 2
image.voxelBlockImg = voxelBlockSampler RED_INTEGER R16UI UNSIGNED_SHORT true false 256 128 256
image.voxelEntityImg = voxelEntitySampler RED_INTEGER R32UI UNSIGNED_INT true false 256 128 256
image.voxelEmitImg = voxelEmitSampler RED_INTEGER R32UI UNSIGNED_INT true false 256 128 256
image.floodImgA = floodSamplerA RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 256 128 256
image.floodImgB = floodSamplerB RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 256 128 256
#else
image.voxelBlockImg = voxelBlockSampler RED_INTEGER R16UI UNSIGNED_SHORT true false 384 128 384
image.voxelEntityImg = voxelEntitySampler RED_INTEGER R32UI UNSIGNED_INT true false 384 128 384
image.voxelEmitImg = voxelEmitSampler RED_INTEGER R32UI UNSIGNED_INT true false 384 128 384
image.floodImgA = floodSamplerA RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 384 128 384
image.floodImgB = floodSamplerB RGB R11F_G11F_B10F UNSIGNED_INT_10F_11F_11F_REV false false 384 128 384
#endif
image.skyTransmittanceImg = skyTransmittanceSampler RGBA RGBA16F HALF_FLOAT false false 256 64
image.skyMultiScatterImg = skyMultiScatterSampler RGBA RGBA16F HALF_FLOAT false false 32 32
image.skyViewImg = skyViewSampler RGBA RGBA16F HALF_FLOAT false false 192 108
image.cloudShadowImg = cloudShadowSampler RED R16F HALF_FLOAT false false 512 512
image.cloudWeatherImg = cloudWeatherSampler RGBA RGBA8 UNSIGNED_BYTE false false 512 512
image.blockLightRawImg = blockLightRawSampler RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.blockLightAuxImg = blockLightAuxSampler RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.giRawImg = giRawSampler RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.reflectionImg = reflectionSampler RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.fogHistoryImg = fogHistorySampler RGBA RGBA16F HALF_FLOAT false true 1.0 1.0
image.debugImg = debugSampler RGBA RGBA16F HALF_FLOAT true true 1.0 1.0

#------------------------------------------------------------------------------
# Custom uniforms
#------------------------------------------------------------------------------
# Nether biome weights (5 s fade) for the ambient light and fog palette (lib/sky/sky_color.glsl getNetherPalette).
# fogColor is not used: it is very saturated (crimson forest is pure red) and its biome blend can lag behind in tests
uniform.float.netherSoulValley = smooth(1, if(biome == BIOME_SOUL_SAND_VALLEY, 1.0, 0.0), 5.0, 5.0)
uniform.float.netherCrimson = smooth(2, if(biome == BIOME_CRIMSON_FOREST, 1.0, 0.0), 5.0, 5.0)
uniform.float.netherWarped = smooth(3, if(biome == BIOME_WARPED_FOREST, 1.0, 0.0), 5.0, 5.0)
uniform.float.netherBasalt = smooth(4, if(biome == BIOME_BASALT_DELTAS, 1.0, 0.0), 5.0, 5.0)
# Overworld ground beyond the render distance (lib/sky/sky_color.glsl skyBelowHorizon) is approximated by the biome at the camera (8 s fade)
uniform.float.distantSnow = smooth(5, if(biome_precipitation == PPT_SNOW, 1.0, 0.0), 8.0, 8.0)
uniform.float.distantSand = smooth(6, if(biome_category == CAT_DESERT || biome_category == CAT_MESA, 1.0, 0.0), 8.0, 8.0)
uniform.float.distantOcean = smooth(7, if(biome_category == CAT_OCEAN, 1.0, 0.0), 8.0, 8.0)
# Water waves: ocean (distantOcean) / river / lake spectra are chosen by the camera biome (lib/surface/water.glsl waterSeaState)
uniform.float.waterRiver = smooth(8, if(biome_category == CAT_RIVER, 1.0, 0.0), 8.0, 8.0)

#------------------------------------------------------------------------------
# Blending
#------------------------------------------------------------------------------
# G-buffer programs store the material ID in colortex1.a, so blending is off
blend.gbuffers_terrain = off
blend.gbuffers_block = off
blend.gbuffers_entities = off
blend.gbuffers_hand = off
blend.gbuffers_basic = off
blend.gbuffers_line = off
blend.gbuffers_textured = off
blend.gbuffers_textured_lit = off
blend.gbuffers_particles = off
blend.gbuffers_beaconbeam = off
blend.gbuffers_clouds = off
# Overlays only blend into albedo rgb and keep alpha (material ID)
blend.gbuffers_armor_glint.colortex1 = SRC_COLOR ONE ZERO ONE
blend.gbuffers_spidereyes.colortex1 = SRC_ALPHA ONE ZERO ONE
blend.gbuffers_damagedblock.colortex1 = DST_COLOR SRC_COLOR ZERO ONE
# Translucent color (colortex4) becomes premultiplied with the default alpha blend. Data (colortex5) is overwritten
blend.gbuffers_water.colortex5 = off
blend.gbuffers_hand_water.colortex5 = off
blend.gbuffers_particles_translucent.colortex5 = off
# Iris 26.1 draws translucent entities (player skins, text, banners) after deferred, so they are forward shaded like glass
blend.gbuffers_entities_translucent.colortex5 = off
blend.gbuffers_entities_translucent.colortex15 = off
blend.gbuffers_block_translucent.colortex5 = off
# Lightning bolts add light to the translucent color without covering what is behind them
blend.gbuffers_lightning = ONE ONE ZERO ONE

