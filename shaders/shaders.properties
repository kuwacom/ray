    !GENERATED_NORMALS !POM !SSS !RAIN_PUDDLES !WATER_PARALLAX WATER_REFRACTION=0 WATER_REFRACTION_MODE=0 !WATER_CAUSTICS REFLECTIONS=0 SSR_STEPS=8 \
