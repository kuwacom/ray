#
# Ray entity.properties
# ID ranges: shaders/lib/ids/entity_ids.glsl. 5100-5163 are light-emitting entities (light index = 192 + (ID - 5100))
# Keep this file ASCII only: Iris reads .properties as ISO-8859-1 and non-ASCII bytes break its preprocessor
#

# The local player (Iris hardcoded ID). Prevents double hand lighting and drives the self-occlusion bits
entity.5001 = minecraft:current_player
entity.5002 = minecraft:player
# Dropped items (whether they glow is decided by currentRenderedItemId)
entity.5003 = minecraft:item
# Item frames (the item inside does not become a light)
entity.5004 = minecraft:item_frame minecraft:glow_item_frame
# Iris hardcoded IDs (no real shape, excluded from occlusion and shadows)
entity.5005 = minecraft:entity_shadow
entity.5006 = minecraft:name_tag
entity.5007 = minecraft:end_crystal_beam

# Light-emitting entities
entity.5100 = minecraft:blaze
entity.5101 = minecraft:magma_cube
entity.5102 = minecraft:glow_squid
entity.5103 = minecraft:allay
entity.5104 = minecraft:end_crystal
entity.5105 = minecraft:experience_orb
entity.5106 = minecraft:spectral_arrow
entity.5107 = minecraft:fireball minecraft:small_fireball
entity.5108 = minecraft:dragon_fireball
entity.5109 = minecraft:tnt
entity.5110 = minecraft:creeper
entity.5111 = minecraft:firework_rocket
entity.5112 = minecraft:lightning_bolt
# Flames on burning entities (Iris hardcoded ID)
entity.5113 = minecraft:entity_flame
entity.5114 = minecraft:shulker_bullet
entity.5115 = minecraft:tnt_minecart
